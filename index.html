<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!--
  Content Security Policy: defense in depth (same posture as the math tutor).
  * default-src none  : nothing loads unless explicitly allowed.
  * script-src sha256 : ONLY this app's own inline code (pinned by hash) runs.
                        Bundled chess.js is part of that one hashed script.
  * connect-src none  : no network of any kind — nothing is sent anywhere.
  * img/font/object none : no external or data resources.
  The computer opponent is pure JavaScript (no WASM/Stockfish), so nothing here
  needs the policy loosened.
-->

<meta name="referrer" content="no-referrer" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Chess Tutor</title>
<style>
  :root{
    --bg: var(--sn-stylekit-background-color, #f6f8fc);
    --fg: var(--sn-stylekit-foreground-color, #1f2937);
    --panel: var(--sn-stylekit-contrast-background-color, #ffffff);
    --border: var(--sn-stylekit-border-color, #e3e8ef);
    --muted: var(--sn-stylekit-neutral-color, #64748b);
    --font: var(--sn-stylekit-editor-font-family, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif);
    --accent:#3b6fd4; --accent2:#7c5cff; --good:#16a34a; --good-bg:#dcfce7;
    --warn:#d97706; --gold:#f59e0b; --shadow:0 2px 0 rgba(0,0,0,.08);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{background:var(--bg);color:var(--fg);font-family:var(--font);line-height:1.4;-webkit-text-size-adjust:100%}
  #root{max-width:640px;margin:0 auto;padding:14px 14px 28px}

  .hero{text-align:center;padding:6px 0 10px}
  .hero-title{font-size:1.4rem;font-weight:800}

  /* rank / xp */
  .rankrow{display:flex;align-items:center;gap:12px;background:var(--panel);border:2px solid var(--border);border-radius:16px;padding:12px;margin-bottom:14px}
  .rankbadge{font-size:2rem;width:48px;height:48px;display:flex;align-items:center;justify-content:center;background:var(--bg);border-radius:12px}
  .rankinfo{flex:1}
  .rankname{font-weight:800}
  .xpbar{height:10px;background:var(--border);border-radius:999px;overflow:hidden;margin:5px 0}
  .xpfill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:999px}
  .xpmeta{font-size:.78rem;color:var(--muted)}

  /* home menu */
  .menu{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .mtile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:2px solid var(--border);background:var(--panel);
    color:var(--fg);border-radius:18px;padding:16px 14px;cursor:pointer;box-shadow:var(--shadow);text-align:left}
  .mtile:active{transform:translateY(2px)}
  .mtile .ti{font-size:1.8rem}
  .mtile .tl{font-weight:800;font-size:1.05rem}
  .mtile .ts{font-size:.76rem;color:var(--muted)}
  .mtile.play{grid-column:1/3}
  .mtile.daily.done{border-color:var(--good);background:var(--good-bg)}
  .rowbtn{display:block;width:100%;margin-top:12px;border:2px solid var(--border);background:var(--panel);color:var(--fg);
    border-radius:14px;padding:13px;font-weight:800;cursor:pointer;font-size:.95rem}
  .rowbtn:active{transform:translateY(1px)}
  .note{margin:16px 6px 0;font-size:.82rem;color:var(--muted);text-align:center}

  /* top bar */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
  .back{border:2px solid var(--border);background:var(--panel);color:var(--fg);border-radius:12px;padding:8px 12px;font-weight:800;cursor:pointer;font-size:.9rem}
  .tbtitle{font-weight:800;font-size:1.05rem;text-align:center}
  .tbsp{width:54px}

  /* lists (lessons + puzzles) */
  .llist{display:flex;flex-direction:column;gap:10px}
  .lcard{display:flex;align-items:center;gap:12px;border:2px solid var(--border);background:var(--panel);color:var(--fg);
    border-radius:16px;padding:12px 14px;cursor:pointer;box-shadow:var(--shadow);text-align:left}
  .lcard:active{transform:translateY(2px)}
  .lemoji{font-size:1.7rem}
  .ltext{display:flex;flex-direction:column;flex:1}
  .ltitle{font-weight:800}
  .lsub{font-size:.78rem;color:var(--muted)}
  .lgo{font-size:1.5rem;color:var(--muted);font-weight:800}
  .badge.ok{color:var(--good);font-size:.85rem}

  /* board */
  .boardwrap{max-width:380px;margin:10px auto}
  .board{display:block;width:100%;height:auto;border-radius:12px}

  /* lesson */
  .sdots{display:flex;gap:6px;justify-content:center;margin:2px 0 10px}
  .sdot{width:8px;height:8px;border-radius:50%;background:var(--border)}
  .sdot.on{background:var(--accent2)}.sdot.past{background:var(--good)}
  .lesstext{font-size:1.08rem;line-height:1.5;text-align:center;padding:0 4px;margin-bottom:8px}
  .taskbar{margin:6px auto;max-width:380px;text-align:center;font-weight:800;color:var(--accent2);background:var(--panel);border:2px solid var(--accent2);border-radius:12px;padding:8px}
  .taskbar.ok{color:var(--good);border-color:var(--good)}
  .lessnav{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:10px}
  .lnav{border:2px solid var(--accent);background:var(--panel);color:var(--accent);font-weight:800;border-radius:14px;padding:12px 20px;cursor:pointer;font-size:1.02rem}
  .lnav.next,.lnav.done{background:var(--accent);color:#fff}.lnav.done{background:var(--good);border-color:var(--good)}
  .lnav:disabled{opacity:.4;cursor:default}

  /* puzzle + game shared */
  .prompt{text-align:center;font-weight:800;color:var(--accent);background:var(--panel);border:2px solid var(--border);border-radius:12px;padding:10px;margin-bottom:4px}
  .result{text-align:center;font-weight:800;border-radius:12px;padding:12px;margin-bottom:4px}
  .result.win{background:var(--good-bg);color:var(--good);border:2px solid var(--good)}
  .gstatus{text-align:center;font-weight:800;padding:8px;color:var(--fg)}
  .gstatus.over{color:var(--accent)}
  .msg{text-align:center;color:var(--warn);font-weight:700;margin:6px 0}
  .hintbox{max-width:420px;margin:8px auto;background:#fffbeb;border:2px solid #fcd34d;color:#92400e;border-radius:12px;padding:10px 12px;font-size:.95rem;text-align:center}
  .btnrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
  .primary{border:none;background:var(--accent);color:#fff;font-weight:800;border-radius:14px;padding:13px 22px;cursor:pointer;font-size:1.02rem;box-shadow:var(--shadow)}
  .primary.big{display:block;width:100%;margin-top:16px}
  .primary:active{transform:translateY(2px)}
  .ghost{border:2px solid var(--border);background:var(--panel);color:var(--fg);font-weight:800;border-radius:14px;padding:11px 16px;cursor:pointer}
  .ghost:active{transform:translateY(1px)}

  /* setup + options */
  .sec{font-size:1rem;margin:16px 2px 8px}
  .opts{display:flex;flex-wrap:wrap;gap:8px}
  .opt{border:2px solid var(--border);background:var(--panel);color:var(--fg);font-weight:800;border-radius:12px;padding:11px 14px;cursor:pointer;min-width:44px}
  .opt.on{border-color:var(--accent);background:var(--accent);color:#fff}
  .leveldesc{margin-top:8px;font-size:.85rem;color:var(--muted)}
  /* Phase C: opponent characters */
  .lvlopt .lvlav{font-size:1.05rem}
  .lvlchar{font-size:1.15rem;font-weight:800;color:var(--fg)}
  .leveldesc2{margin-top:4px}
  .levelintro{font-style:italic;opacity:.85}
  .charbubble{max-width:420px;margin:8px auto;background:var(--panel);border:2px solid var(--border);border-radius:14px;padding:8px 12px;text-align:center;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;animation:pop .25s ease}
  .charbubble .cbav{font-size:1.5rem;line-height:1}
  .charbubble.gg{border-color:var(--accent);background:var(--accent);color:#fff}
  @keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}

  /* progress */
  .stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 4px}
  .stat{background:var(--panel);border:2px solid var(--border);border-radius:14px;padding:10px 4px;text-align:center}
  .statn{font-size:1.25rem;font-weight:800}.statl{font-size:.72rem;color:var(--muted)}
  .ladder{display:flex;flex-direction:column;gap:6px}
  .rl{display:flex;justify-content:space-between;border:2px solid var(--border);border-radius:12px;padding:9px 12px;font-weight:700;color:var(--muted)}
  .rl.got{border-color:var(--accent);color:var(--fg);background:var(--panel)}
  .rlxp{font-size:.8rem;color:var(--muted)}
  .resetwrap{margin-top:18px;text-align:center}
  .resetconfirm{background:#fef2f2;border:2px solid #ef4444;border-radius:14px;padding:14px;font-weight:700;color:#991b1b}
  .resetconfirm>div{margin-top:10px;display:flex;gap:10px;justify-content:center}
  .danger{border:none;background:#dc2626;color:#fff;font-weight:800;border-radius:12px;padding:10px 16px;cursor:pointer}

  /* v2 additions */
  .menu.small .mtile{padding:12px 10px}
  .menu.small .ti{font-size:1.4rem}
  .menu.small .tl{font-size:.92rem}
  .toast{background:#fffbeb;border:2px solid var(--gold);color:#92400e;border-radius:12px;padding:10px 12px;margin-bottom:10px;font-weight:800;text-align:center}
  .toast.rankup{background:linear-gradient(90deg,#fef3c7,#fde68a);border-color:var(--accent);color:#7c2d12}
  .toast.save{background:#dcfce7;border-color:#16a34a;color:#166534}
  .primary.resume{margin-top:8px;background:#16a34a;border-color:#16a34a}
  .goalnote{margin:0 6px 6px;font-size:.82rem}
  .tray{display:flex;align-items:center;justify-content:space-between;gap:8px;max-width:380px;margin:0 auto 4px;font-size:1.1rem}
  .traypieces{color:var(--muted);min-width:60px}
  .traypieces:last-child{text-align:right}
  .traylead{font-size:.8rem;font-weight:800;color:var(--accent)}
  .coachbox{max-width:420px;margin:8px auto;background:#fff7ed;border:2px solid var(--warn);color:#9a3412;border-radius:14px;padding:12px;text-align:center;font-weight:700}
  .coachbtns{margin-top:10px;display:flex;gap:10px;justify-content:center}
  .taskbar{margin:6px auto;max-width:380px;text-align:center;font-weight:800;color:var(--accent2);background:var(--panel);border:2px solid var(--accent2);border-radius:12px;padding:8px}
  .reviewpos{font-weight:800;color:var(--muted)}
  .empty{margin:30px 8px;text-align:center;color:var(--muted)}
  .hint-sm{font-size:.78rem;color:var(--muted);margin:6px 2px}
  /* settings toggles */
  .toggles{display:flex;flex-direction:column;gap:8px}
  .toggle{display:flex;align-items:center;justify-content:space-between;border:2px solid var(--border);background:var(--panel);color:var(--fg);border-radius:12px;padding:12px 14px;font-weight:700;cursor:pointer}
  .toggle.on{border-color:var(--good)}
  .toggle .sw{font-size:.78rem;font-weight:800;color:var(--muted);border:2px solid var(--border);border-radius:999px;padding:2px 10px}
  .toggle.on .sw{color:#fff;background:var(--good);border-color:var(--good)}
  /* badges */
  .badges{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .badge2{display:flex;align-items:center;gap:8px;border:2px solid var(--border);border-radius:12px;padding:8px 10px;color:var(--muted);opacity:.7}
  .badge2.got{opacity:1;color:var(--fg);border-color:var(--gold);background:var(--panel)}
  .b2e{font-size:1.3rem}
  .b2n{font-size:.82rem;font-weight:700}
  .rushbar{display:flex;justify-content:space-between;align-items:center;max-width:380px;margin:4px auto 6px;font-weight:800;font-size:1.05rem}
  .dailyprog{text-align:center;font-weight:800;color:var(--gold,#f59e0b);margin:2px 0 6px}
</style>
</head>

glides on diagonals only. Each bishop stays on one color forever \u2014 a light-square bishop and a dark-square bishop.",fen:"7k/8/8/8/8/8/8/2B4K w - - 0 1"},{text:"Send the bishop along its diagonal from c1 to h6.",fen:"7k/8/8/8/8/8/8/2B4K w - - 0 1",task:{from:"c1",to:"h6"}},{text:"Bishops love open, empty diagonals where they can see across the whole board."}]},{id:"knight",title:"The Knight",emoji:"\u265E",level:"Beginner",steps:[{text:"The knight is the trickiest! It moves in an 'L': two squares one way, then one square to the side. It's the only piece that can JUMP over others.",fen:"7k/8/8/8/8/8/8/1N5K w - - 0 1"},{text:"Hop the knight from b1 to c3 \u2014 two up and one across.",fen:"7k/8/8/8/8/8/8/1N5K w - - 0 1",task:{from:"b1",to:"c3"}},{text:"Knights are great in the center, where they can reach up to eight squares. Tip: a knight always lands on the opposite color from where it started."}]},{id:"queen",title:"The Queen",emoji:"\u265B",level:"Beginner",steps:[{text:"The queen is the most powerful piece. She moves like a rook AND a bishop \u2014 any straight line or diagonal, as far as she wants.",fen:"7k/8/8/8/8/8/8/3Q3K w - - 0 1"},{text:"Show her power: move the queen from d1 to d8.",fen:"7k/8/8/8/8/8/8/3Q3K w - - 0 1",task:{from:"d1",to:"d8"}},{text:"Because she's so valuable, keep your queen safe \u2014 don't bring her out too early where she can be chased around."}]},{id:"king",title:"The King",emoji:"\u265A",level:"Beginner",steps:[{text:"The king moves one square in any direction. He's not strong, but he's the most important piece \u2014 protect him at all costs!",fen:"7k/8/8/8/8/8/8/4K3 w - - 0 1"},{text:"Step the king from e1 to e2.",fen:"7k/8/8/8/8/8/8/4K3 w - - 0 1",task:{from:"e1",to:"e2"}},{text:"The king can never move next to the other king, and can never move into danger. If your king is trapped and under attack, that's checkmate \u2014 and the game ends."}]},{id:"checkmate",title:"Check & Checkmate",emoji:"\u{1F451}",level:"Beginner",steps:[{text:"When the king is under attack, that's CHECK. You must get out of check right away \u2014 move the king, block the attack, or capture the attacker.",fen:"6k1/5ppp/8/8/8/8/8/4R1K1 w - - 0 1"},{text:"If a king is in check and there is NO way to escape, that's CHECKMATE \u2014 the game is over. Here White plays Re8 and the black king is trapped against its own pawns.",fen:"4R1k1/5ppp/8/8/8/8/8/6K1 b - - 0 1"},{text:"The whole goal of chess is to checkmate the other king. If neither side can checkmate, or a player has no legal move but isn't in check (stalemate), the game is a draw."}]},{id:"castling",title:"Castling (King Safety)",emoji:"\u{1F3F0}",level:"Intermediate",steps:[{text:"Castling is a special move that tucks your king into safety and brings a rook into the game \u2014 all at once. It's the only time two pieces move together.",fen:"r3k2r/pppppppp/8/8/8/8/PPPPPPPP/R3K2R w KQkq - 0 1"},{text:"Castle kingside: move your king two squares toward the h-rook (e1 to g1) and the rook hops over.",fen:"r3k2r/pppppppp/8/8/8/8/PPPPPPPP/R3K2R w KQkq - 0 1",task:{from:"e1",to:"g1"}},{text:"You can only castle if the king and that rook haven't moved, the squares between are empty, and your king isn't in check or passing through an attacked square. Castle early to keep your king safe!"}]},{id:"promotion",title:"Pawn Promotion",emoji:"\u{1F451}",level:"Intermediate",steps:[{text:"When a pawn reaches the far end of the board, it gets promoted \u2014 it turns into any piece you choose. Almost always, pick a queen!",fen:"7k/P7/8/8/8/8/8/7K w - - 0 1"},{text:"Push the pawn to a8 and make a new queen.",fen:"7k/P7/8/8/8/8/8/7K w - - 0 1",task:{from:"a7",to:"a8",promotion:"q"}},{text:"This is why even a single extra pawn matters \u2014 it can become a queen in the endgame and win the game."}]},{id:"value",title:"How Much Is Each Piece Worth?",emoji:"\u2696\uFE0F",level:"Beginner",steps:[{text:"Pieces have rough point values that help you decide trades: Pawn = 1, Knight = 3, Bishop = 3, Rook = 5, Queen = 9. The king is priceless.",fen:re},{text:"Trade when you come out ahead \u2014 giving a bishop (3) to win a rook (5) is a great deal. Avoid giving up a big piece for a small one.",fen:re},{text:"Counting points after trades tells you who is 'up material'. More material usually means a winning advantage."}]},{id:"opening",title:"3 Golden Opening Rules",emoji:"\u{1F680}",level:"Intermediate",steps:[{text:"Rule 1 \u2014 Control the center. Pawns on e4/d4 (or e5/d5) grab the middle, where pieces are strongest.",fen:"rnbqkbnr/pppp1ppp/8/4p3/4P3/8/PPPP1PPP/RNBQKBNR w KQkq - 0 2"},{text:"Rule 2 \u2014 Develop your knights and bishops out toward the center early. Don't move the same piece twice or bring the queen out too soon.",fen:"r1bqkbnr/pppp1ppp/2n5/4p3/4P3/5N2/PPPP1PPP/RNBQKB1R w KQkq - 0 3"},{text:"Rule 3 \u2014 Castle early to keep your king safe. Develop, castle, connect your rooks \u2014 then start your plan.",fen:"r1bqk2r/pppp1ppp/2n2n2/2b1p3/2B1P3/5N2/PPPP1PPP/RNBQ1RK1 b kq - 0 5"}]},{id:"escape_check",title:"Getting Out of Check",emoji:"\u{1F6E1}\uFE0F",level:"Beginner",steps:[{text:"When your king is attacked, that's CHECK \u2014 and you MUST get out of it immediately. There are exactly three ways.",fen:"4k3/8/8/8/8/8/4r3/4K3 w - - 0 1"},{text:"Way 1: MOVE the king to a safe square. Here the king can step aside off the e-file to escape the rook.",fen:"4k3/8/8/8/8/8/4r3/4K3 w - - 0 1"},{text:"Way 2: BLOCK the check by putting a piece in the way. Way 3: CAPTURE the attacking piece. If none of the three is possible, it's checkmate!"}]},{id:"stalemate",title:"Stalemate: a Sneaky Draw",emoji:"\u{1F91D}",level:"Intermediate",steps:[{text:"Stalemate is when the player to move has NO legal move \u2014 but is NOT in check. The game is a draw, not a win!",fen:"k7/8/1Q6/8/8/8/8/7K b - - 0 1"},{text:"Here it's Black to move. The king isn't in check, but every square it could go to is covered. No legal move + no check = stalemate = draw.",fen:"k7/8/1Q6/8/8/8/8/7K b - - 0 1"},{text:"Lesson: when you're winning big, give the enemy king room so you don't accidentally stalemate and throw away the win."}]},{id:"en_passant",title:"En Passant (Special Capture)",emoji:"\u{1F47B}",level:"Intermediate",steps:[{text:"En passant ('in passing') is a special pawn capture. If an enemy pawn jumps two squares to land right beside yours, you may capture it as if it had moved only one \u2014 but ONLY on the very next move.",fen:"rnbqkbnr/pp1ppppp/8/2pP4/8/8/PPP1PPPP/RNBQKBNR w KQkq c6 0 3"},{text:"Black just played c7\u2013c5, sliding past your d5 pawn. Capture it 'in passing': move your d5 pawn diagonally to c6.",fen:"rnbqkbnr/pp1ppppp/8/2pP4/8/8/PPP1PPPP/RNBQKBNR w KQkq c6 0 3",task:{from:"d5",to:"c6"}},{text:"Your pawn lands on c6 and the black pawn is removed. Remember: you lose the right to do it if you wait even one move."}]},{id:"trades",title:"Good Trades, Bad Trades",emoji:"\u2696\uFE0F",level:"Beginner",steps:[{text:"Use the point values to judge trades: Pawn 1, Knight 3, Bishop 3, Rook 5, Queen 9.",fen:re},{text:"A GOOD trade wins points: giving a knight (3) to capture a rook (5) gains you 2 points \u2014 that's 'winning the exchange'.",fen:re},{text:"A BAD trade loses points: never give your queen (9) for a knight (3) unless it leads to checkmate. Count before you capture!"}]},{id:"tactic_fork",title:"The Fork",emoji:"\u{1F374}",level:"Intermediate",steps:[{text:"A FORK is one piece attacking two enemy pieces at once. Knights are the kings of forking because they jump.",fen:"4k3/8/4q3/1N6/8/8/8/6K1 w - - 0 1"},{text:"Your knight can leap to c7, attacking the king AND the queen at the same time. Play Nc7 (knight from b5 to c7).",fen:"4k3/8/4q3/1N6/8/8/8/6K1 w - - 0 1",task:{from:"b5",to:"c7"}},{text:"It's check, so the king must move \u2014 then you grab the queen for free next move. That's the power of a fork!"}]},{id:"tactic_pin",title:"The Pin",emoji:"\u{1F4CC}",level:"Intermediate",steps:[{text:"A PIN freezes an enemy piece in place because moving it would expose something more valuable behind it.",fen:"r1bqkbnr/pppp1ppp/2n5/1B2p3/4P3/5N2/PPPP1PPP/RNBQK2R b KQkq - 0 1"},{text:"The white bishop on b5 pins the knight on c6 to the black king. That knight can't move \u2014 it would leave the king in check (illegal!).",fen:"r1bqkbnr/pppp1ppp/2n5/1B2p3/4P3/5N2/PPPP1PPP/RNBQK2R b KQkq - 0 1"},{text:"Pinned pieces are weak \u2014 they can't run away, so you can pile on more attackers and win them."}]},{id:"tactic_skewer",title:"The Skewer",emoji:"\u{1F362}",level:"Intermediate",steps:[{text:"A SKEWER is like a backwards pin: you attack a VALUABLE piece, and when it moves, you capture the piece behind it.",fen:"4k3/8/8/8/8/8/4K3/Q6r w - - 0 1"},{text:"Imagine your queen checks the king along a line, the king steps aside, and a rook waiting behind it gets captured. Big pieces in a line are in danger of skewers.",fen:"4k3/8/8/8/8/8/4K3/Q6r w - - 0 1"}]},{id:"ladder_mate",title:"Two-Rook Ladder Mate",emoji:"\u{1FA9C}",level:"Intermediate",steps:[{text:"Two rooks can checkmate a lone king by themselves \u2014 no king needed. They work like a ladder, pushing the king to the edge.",fen:"6k1/8/8/8/8/8/1R6/R5K1 w - - 0 1"},{text:"One rook checks to push the king back a rank; the other guards the next rank. Step by step, the king is forced to the last row and mated.",fen:"6k1/8/8/8/8/8/1R6/R5K1 w - - 0 1"},{text:"Key tip: keep your rooks far apart (or on opposite sides) so the king can never attack them while you climb the ladder."}]},{id:"double_attack",title:"The Double Attack",emoji:"\u{1F3AF}",level:"Intermediate",steps:[{text:"A DOUBLE ATTACK is one move that threatens two things at once. Your opponent can only save one \u2014 so you win the other. A fork is one kind of double attack.",fen:"r5k1/8/8/8/8/8/8/3QK3 w - - 0 1"},{text:"Your queen can land on d5, where it CHECKS the king and ATTACKS the rook on a8 at the same time. Play Qd5 (queen from d1 to d5).",fen:"r5k1/8/8/8/8/8/8/3QK3 w - - 0 1",task:{from:"d1",to:"d5"}},{text:"Because it's check, the king must move first \u2014 and then you capture the rook for free. Always look for a move that does two jobs at once!"}]},{id:"back_rank_safety",title:"Back-Rank Safety (Make Luft)",emoji:"\u{1FA9F}",level:"Intermediate",steps:[{text:"When your king hides behind three pawns, it can be safe \u2014 but also trapped. If an enemy rook or queen reaches the back row, it's checkmate with no escape!",fen:"6k1/5ppp/8/8/8/8/8/R5K1 w - - 0 1"},{text:"Here a rook reaching a8 would be mate, because the g8 king can't step up past its own pawns. The fix is easy: make 'luft' (air) by nudging a pawn \u2014 like h7\u2013h6 \u2014 so the king has an escape square.",fen:"6k1/5ppp/8/8/8/8/8/R5K1 w - - 0 1"},{text:"Lesson: when the middlegame quiets down, give your king a little window. And remember \u2014 your opponent's back rank may be weak too!"}]},{id:"active_king",title:"The King Is a Fighter (Endgame)",emoji:"\u{1F934}",level:"Intermediate",steps:[{text:"Early on you hide your king. But once most pieces are traded off, the king becomes a STRONG piece \u2014 march it toward the action!",fen:"8/8/8/3k4/8/3K4/8/8 w - - 0 1"},{text:"When the kings stand face to face with one square between them, that's the OPPOSITION. The player NOT to move holds it \u2014 it's a key trick for promoting pawns and winning endgames.",fen:"8/8/3k4/8/3K4/8/8/8 w - - 0 1"},{text:"Endgame rule of thumb: activate your king, push a passed pawn, and use the opposition to push the enemy king back."}]},{id:"develop",title:"Get Your Pieces Out",emoji:"\u{1F3C7}",level:"Beginner",steps:[{text:"At the start, your knights and bishops are stuck on the back row. 'Developing' means bringing them out toward the center where they're strong.",fen:re},{text:"Here's a well-developed setup: knights and bishops are out, and both sides are ready to castle. Compare it to the cramped starting position \u2014 these pieces are doing real work.",fen:"r1bqk2r/pppp1ppp/2n2n2/2b1p3/2B1P3/2N2N2/PPPP1PPP/R1BQK2R w KQkq - 0 1"},{text:"Quick checklist for every opening: control the center, get a knight and bishop out, then castle. Don't move the same piece twice or bring the queen out too early."}]},{id:"discovered_attack",title:"Discovered Attack & Double Check",emoji:"\u{1F3AD}",level:"Advanced",steps:[{text:"A DISCOVERED attack happens when you move one piece OUT OF THE WAY, and a piece hiding behind it springs to life. Here your knight on e4 is blocking your rook's view of the black king.",fen:"4k3/8/8/8/4N3/8/4R3/4K3 w - - 0 1"},{text:"Move the knight to d6. The rook suddenly checks the king down the e-file \u2014 AND your knight attacks the king too! Play Ne4 to d6.",fen:"4k3/8/8/8/4N3/8/4R3/4K3 w - - 0 1",task:{from:"e4",to:"d6"}},{text:"Two pieces giving check at once is a DOUBLE CHECK \u2014 the most powerful move in chess. The king MUST move (you can't block or capture your way out of two checks at once)."}]},{id:"double_check",title:"Why Double Check Is So Strong",emoji:"\u203C\uFE0F",level:"Advanced",steps:[{text:"Normally you can answer a check three ways: move, block, or capture. But when TWO pieces check at once, blocking or capturing can only stop one of them.",fen:"3k4/8/2N5/8/8/8/8/3R1K2 b - - 0 1"},{text:"Here the knight on c6 AND the rook on d1 both check the black king. There is no single move that stops both \u2014 so the king is forced to run. That's why double checks often lead to checkmate.",fen:"3k4/8/2N5/8/8/8/8/3R1K2 b - - 0 1"}]},{id:"pawn_fork",title:"Pawns Can Fork Too",emoji:"\u{1F374}",level:"Intermediate",steps:[{text:"Forks aren't just for knights! A humble pawn can attack two pieces at once \u2014 and since a pawn is the cheapest piece, the enemy almost always loses one of them.",fen:"8/8/8/3r1r2/4P3/8/4K3/6k1 w - - 0 1"},{text:"This little pawn on e4 attacks BOTH black rooks (on d5 and f5) diagonally. Black can only save one. Always watch for pawns that can split two pieces.",fen:"8/8/8/3r1r2/4P3/8/4K3/6k1 w - - 0 1"}]},{id:"removing_defender",title:"Remove the Defender",emoji:"\u{1F9F9}",level:"Advanced",steps:[{text:"Sometimes a piece is safe only because ONE friend guards it. Take away that guard, and the piece falls. Here Black's queen on e7 is the only thing defending the rook on e8.",fen:"4rk2/4qppp/8/8/8/8/4Q1PP/4R1K1 w - - 0 1"},{text:"If you can trade off or chase away that black queen, your rook on e1 wins the now-undefended rook on e8. Before you attack something, ask: what is defending it \u2014 and can I remove it?",fen:"4rk2/4qppp/8/8/8/8/4Q1PP/4R1K1 w - - 0 1"}]},{id:"deflection",title:"Deflection: Pull a Piece Away",emoji:"\u{1F9F2}",level:"Advanced",steps:[{text:"DEFLECTION means forcing a busy enemy piece to leave an important job. If a piece is guarding a key square, make it an offer it can't refuse somewhere else.",fen:"2r3k1/5ppp/8/8/8/8/5PPP/2R3K1 w - - 0 1"},{text:"Imagine that black rook on c8 is the only thing stopping your rook from crashing in. A check or a threat that drags it away lets you strike where it used to defend. Lure the guard away, then pounce.",fen:"2r3k1/5ppp/8/8/8/8/5PPP/2R3K1 w - - 0 1"}]},{id:"decoy",title:"Decoy: Lure It to a Bad Square",emoji:"\u{1F986}",level:"Advanced",steps:[{text:"A DECOY tempts an enemy piece (often the king) ONTO a square where something bad happens \u2014 like a fork or a check. Sometimes you even sacrifice a piece to drag the king into the open.",fen:"6k1/5ppp/8/8/8/7Q/8/6K1 w - - 0 1"},{text:"The idea: give a check or a gift that forces the king to step onto exactly the square you want, then hit it. Deflection pulls a piece AWAY; a decoy pulls it TOWARD a trap.",fen:"6k1/5ppp/8/8/8/7Q/8/6K1 w - - 0 1"}]},{id:"overloading",title:"The Overloaded Piece",emoji:"\u{1F975}",level:"Advanced",steps:[{text:"A piece is OVERLOADED when it has too many jobs at once. That black rook on f8 is guarding the f7 pawn AND watching the back rank \u2014 it can't do both if you attack both.",fen:"3r1rk1/5ppp/8/8/8/8/5PPP/3R1RK1 w - - 0 1"},{text:"When you spot a piece doing two important jobs, attack one of them. Whatever it chooses to save, you grab the other. Give a defender too much work and it breaks.",fen:"3r1rk1/5ppp/8/8/8/8/5PPP/3R1RK1 w - - 0 1"}]},{id:"trapped_piece",title:"Trapping a Piece",emoji:"\u{1F578}\uFE0F",level:"Intermediate",steps:[{text:"A piece can be worth nothing if it has nowhere safe to go. Greedy pieces that grab a pawn in the corner often get TRAPPED. Look at the black bishop stuck on a1.",fen:"7k/8/8/8/8/1P6/P7/b6K w - - 0 1"},{text:"Its only path out is b2 \u2014 but it can be met and captured. When an enemy piece wanders deep to snack on a pawn, check if you can build a wall and trap it.",fen:"7k/8/8/8/8/1P6/P7/b6K w - - 0 1"}]},{id:"battery",title:"Build a Battery",emoji:"\u{1F50B}",level:"Intermediate",steps:[{text:"A BATTERY is two pieces lined up on the same file, rank, or diagonal, pointing the same way \u2014 like a queen behind a rook. Together they hit far harder than alone.",fen:"4k3/8/8/8/8/8/3Q4/3RK3 w - - 0 1"},{text:"Here the rook on d1 and queen on d2 are doubled on the d-file. The rook leads, the queen backs it up \u2014 perfect for smashing open a file or mating on the back rank. Double your rooks and queen for a knockout.",fen:"4k3/8/8/8/8/8/3Q4/3RK3 w - - 0 1"}]},{id:"open_file",title:"Rooks Love Open Files",emoji:"\u{1F6E4}\uFE0F",level:"Intermediate",steps:[{text:"An OPEN FILE is a column with no pawns on it. Rooks are at their best there \u2014 they can zoom up and down, controlling the whole column.",fen:"3rk3/8/8/8/8/8/8/3R2K1 w - - 0 1"},{text:"Put your rooks on open files (or files that are about to open). The d-file here belongs to whoever controls it. Whoever grabs the open file first usually gets to invade.",fen:"3rk3/8/8/8/8/8/8/3R2K1 w - - 0 1"}]},{id:"rook_seventh",title:"A Rook on the 7th Rank",emoji:"\u{1F437}",level:"Intermediate",steps:[{text:"A rook that reaches the enemy's 2nd rank (your 7th) is a monster \u2014 players call it a 'pig' because it gobbles up pawns and pins the enemy king to the back row.",fen:"4k3/R6p/8/8/8/8/8/6K1 w - - 0 1"},{text:"From a7 your rook attacks the pawn AND keeps the black king stuck. Two rooks on the 7th are even scarier. Aim to land a rook on that rank in the endgame.",fen:"4k3/R6p/8/8/8/8/8/6K1 w - - 0 1"}]},{id:"outpost",title:"Knight Outposts",emoji:"\u{1F3D5}\uFE0F",level:"Intermediate",steps:[{text:"An OUTPOST is an advanced square where your knight can sit safely \u2014 protected by your own pawn, and where no enemy pawn can ever kick it away. Knights adore outposts.",fen:"4k3/8/8/3N4/2P5/8/8/4K3 w - - 0 1"},{text:"The knight on d5 is supported by the c4 pawn and can't be chased by a pawn. A well-placed knight on an outpost can be as strong as a rook. Build little homes for your knights.",fen:"4k3/8/8/3N4/2P5/8/8/4K3 w - - 0 1"}]},{id:"passed_pawn",title:"The Passed Pawn",emoji:"\u{1F3C3}",level:"Intermediate",steps:[{text:"A PASSED PAWN has no enemy pawns in front of it or on the files beside it \u2014 nothing can stop it from running to promote. It's a future queen!",fen:"4k3/8/8/3P4/8/8/8/4K3 w - - 0 1"},{text:"Push your passed pawns, and use your king and pieces to escort them. As the saying goes, 'a passed pawn must be pushed!' In the endgame, one passer can win the whole game.",fen:"4k3/8/8/3P4/8/8/8/4K3 w - - 0 1"}]},{id:"pawn_weaknesses",title:"Strong & Weak Pawns",emoji:"\u{1F9F1}",level:"Advanced",steps:[{text:"Pawns can't move backward, so weak pawns stay weak. DOUBLED pawns (two on one file, like the c-pawns here) get in each other's way, and an ISOLATED pawn (the lone a-pawn) has no pawn friend to guard it.",fen:"4k3/8/8/8/8/2P5/P1P5/4K3 w - - 0 1"},{text:"Try to give yourself healthy pawns in a connected chain, and aim your pieces at the enemy's weak ones. Pawn structure is the skeleton of every position.",fen:"4k3/8/8/8/8/2P5/P1P5/4K3 w - - 0 1"}]},{id:"good_bad_bishop",title:"Good Bishop, Bad Bishop",emoji:"\u{1F607}",level:"Advanced",steps:[{text:"A bishop only travels on ONE color. If your own pawns are stuck on that same color, they block your bishop \u2014 that's a 'bad bishop' hiding behind its own pawns.",fen:"4k3/p1p1p3/8/8/8/8/PBP1P3/4K3 w - - 0 1"},{text:"Keep your pawns on the OPPOSITE color from your bishop so it stays free and active. When you trade, try to keep your good bishop and swap off your bad one.",fen:"4k3/p1p1p3/8/8/8/8/PBP1P3/4K3 w - - 0 1"}]},{id:"attack_king",title:"Attacking the Castled King",emoji:"\u2694\uFE0F",level:"Advanced",steps:[{text:"When both kings have castled on the same side, you can launch an attack by storming your pawns forward and aiming your pieces at the king's little house.",fen:"r2q1rk1/ppp2ppp/8/8/8/8/PPP2PPP/R2Q1RK1 w - - 0 1"},{text:"Bring MORE attackers than they have defenders, pry open a file or diagonal toward the king, and don't trade off your attacking pieces. The more force you gather near the king, the better.",fen:"r2q1rk1/ppp2ppp/8/8/8/8/PPP2PPP/R2Q1RK1 w - - 0 1"}]},{id:"fianchetto",title:"The Fianchetto",emoji:"\u{1F3F9}",level:"Intermediate",steps:[{text:"FIANCHETTO (say 'fyan-KET-toe') means tucking your bishop on the long diagonal \u2014 like this bishop on g2 \u2014 after moving the knight-pawn one step. It guards your castled king and snipes across the whole board.",fen:"6k1/5ppp/8/8/8/6P1/5PBP/6K1 w - - 0 1"},{text:"A fianchettoed bishop is a long-range sniper and a loyal bodyguard. Just be careful about trading it away, because the squares it covered can become weak.",fen:"6k1/5ppp/8/8/8/6P1/5PBP/6K1 w - - 0 1"}]},{id:"square_of_pawn",title:"The Rule of the Square",emoji:"\u{1F7E6}",level:"Advanced",steps:[{text:"Can a lone king catch a running pawn? There's a trick so you don't have to count move by move. Picture a square whose side reaches from the pawn to its promotion rank.",fen:"8/8/8/8/8/k7/7P/7K w - - 0 1"},{text:"If the enemy king can step INTO that imaginary square (on its move), it catches the pawn. If it can't, the pawn promotes! Here Black's king is far away \u2014 the h-pawn will run and queen.",fen:"8/8/8/8/8/k7/7P/7K w - - 0 1"}]},{id:"insufficient_material",title:"When Nobody Can Win (Draws)",emoji:"\u{1F91D}",level:"Intermediate",steps:[{text:"Some endings are automatic draws because there just isn't enough material to checkmate. A lone king plus only a single bishop (or a single knight) versus a king can NEVER force mate.",fen:"8/8/8/4k3/8/8/4B3/4K3 w - - 0 1"},{text:"Other draws: king vs king, and repeating the same position three times, or 50 moves with no pawn move or capture. Knowing what's a draw tells you when to fight on \u2014 and when to be happy with a half point.",fen:"8/8/8/4k3/8/8/4B3/4K3 w - - 0 1"}]},{id:"notation",title:"Reading & Writing Moves",emoji:"\u270D\uFE0F",level:"Intermediate",steps:[{text:"Chess moves have a secret code so anyone can write them down. Each piece has a letter: K=king, Q=queen, R=rook, B=bishop, N=knight. Pawns have no letter \u2014 just the square.",fen:re},{text:"So 'e4' means a pawn to e4, and 'Nf3' means a knight to f3. An 'x' means capture (Bxe5), '+' means check, '#' means checkmate, and castling is O-O (kingside) or O-O-O (queenside).",fen:re},{text:"Writing your games down lets you replay them later and learn from your mistakes \u2014 just like a chess detective reviewing the clues!"}]},{id:"blunder_check",title:"Think Before You Move",emoji:"\u{1F9E0}",level:"Beginner",steps:[{text:"The #1 way beginners lose is by giving pieces away for free. Before EVERY move, do a quick safety check \u2014 it only takes a few seconds and saves whole games.",fen:"rnbqkbnr/pppp1ppp/8/4p3/4P3/8/PPPP1PPP/RNBQKBNR w KQkq - 0 2"},{text:"Ask three questions: 1) Is the piece I'm moving safe where it lands? 2) Am I leaving anything undefended (hanging)? 3) Is my king safe? Also check: does my opponent have any checks, captures, or threats?",fen:"rnbqkbnr/pppp1ppp/8/4p3/4P3/8/PPPP1PPP/RNBQKBNR w KQkq - 0 2"},{text:"Slow down on every move, especially when something looks like a free gift \u2014 it might be a trap. Patient players win games."}]},{id:"dont_queen_early",title:"Don't Rush Your Queen Out",emoji:"\u{1F478}",level:"Beginner",steps:[{text:"It's tempting to bring your powerful queen out early to attack \u2014 but she becomes a target. Look: Black's queen popped out to h4, and now White can develop pieces WHILE chasing her.",fen:"rnbqkbnr/pppp1ppp/8/4p3/4P2q/8/PPPP1PPP/RNBQKBNR w KQkq - 2 3"},{text:"Every time you attack the early queen, she must run \u2014 and you get to develop a piece for free (that's called gaining 'tempo'). Develop knights and bishops first; bring the queen out a little later, safely.",fen:"rnbqkbnr/pppp1ppp/8/4p3/4P2q/8/PPPP1PPP/RNBQKBNR w KQkq - 2 3"}]}],Te=[{id:"p1",fen:"6k1/5ppp/8/8/8/8/8/4R1K1 w - - 0 1",level:1,theme:"Back-rank mate",solutionSan:"Re8#",hint:"Your rook controls the whole back row. The black king is boxed in by its own pawns."},{id:"p2",fen:"7k/6pp/8/8/8/8/6PP/5R1K w - - 0 1",level:1,theme:"Back-rank mate",solutionSan:"Rf8#",hint:"Slide your rook to the 8th rank. The king has no escape over its pawns."},{id:"p3",fen:"k7/8/1K6/8/8/8/8/7R w - - 0 1",level:1,theme:"Rook & king mate",solutionSan:"Rh8#",hint:"Your king guards the escape squares \u2014 bring the rook to the back rank."},{id:"p4",fen:"3k4/8/3K4/8/8/8/8/7Q w - - 0 1",level:2,theme:"Queen & king mate",solutionSan:"Qh8#",hint:"Your king takes away the escape squares. Deliver check on the back rank with the queen."},{id:"p5",fen:"6k1/5ppp/8/8/8/8/8/R5RK w - - 0 1",level:2,theme:"Two rooks",solutionSan:"Ra8#",hint:"One rook checks on the back rank while the king hides behind its pawns."},{id:"p6",fen:"7k/R5pp/8/8/8/8/8/1R4K1 w - - 0 1",level:2,theme:"Rook ladder",solutionSan:"Rb8#",hint:"One rook already cuts off the 7th rank. Bring the other to the 8th."},{id:"p7",fen:"r1bqkb1r/pppp1ppp/2n2n2/4p2Q/2B1P3/8/PPPP1PPP/RNB1K1NR w KQkq - 4 4",level:3,theme:"Scholar's mate",so
